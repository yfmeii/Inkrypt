name: Deploy Inkrypt

on:
  workflow_dispatch:
    inputs:
      domain:
        description: 'Custom domain (e.g. notes.example.com)'
        required: true
        type: string
      rp_name:
        description: 'RP_NAME (default: Inkrypt)'
        required: false
        default: 'Inkrypt'
        type: string
      cookie_samesite:
        description: 'COOKIE_SAMESITE (default: Lax)'
        required: false
        default: 'Lax'
        type: string
      cors_origin:
        description: 'Deprecated: CORS is fixed to https://<DOMAIN>'
        required: false
        default: ''
        type: string
      pages_project_name:
        description: 'Override Pages project name (optional)'
        required: false
        default: ''
        type: string
      worker_name:
        description: 'Override Worker name (optional)'
        required: false
        default: ''
        type: string
      d1_name:
        description: 'Override D1 database name (optional)'
        required: false
        default: ''
        type: string
      d1_location:
        description: 'D1 location hint (weur/eeur/apac/oc/wnam/enam) (optional)'
        required: false
        default: ''
        type: string
      force_takeover_dns:
        description: 'Override existing DNS record if it differs (true/false)'
        required: false
        default: 'false'
        type: string
      force_takeover_routes:
        description: 'Override existing Worker routes if they differ (true/false)'
        required: false
        default: 'false'
        type: string
      wait_for_tls:
        description: 'Wait until https://<DOMAIN> becomes reachable (true/false)'
        required: false
        default: 'true'
        type: string

concurrency:
  group: inkrypt-deploy-${{ github.repository }}-${{ inputs.domain }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DOMAIN: ${{ inputs.domain }}

      # Optional overrides
      INKRYPT_RP_NAME: ${{ inputs.rp_name }}
      INKRYPT_COOKIE_SAMESITE: ${{ inputs.cookie_samesite }}
      INKRYPT_CORS_ORIGIN: ${{ inputs.cors_origin }}
      INKRYPT_PAGES_PROJECT_NAME: ${{ inputs.pages_project_name }}
      INKRYPT_WORKER_NAME: ${{ inputs.worker_name }}
      INKRYPT_D1_NAME: ${{ inputs.d1_name }}

      # Safety toggles
      FORCE_TAKEOVER_DNS: ${{ inputs.force_takeover_dns }}
      FORCE_TAKEOVER_ROUTES: ${{ inputs.force_takeover_routes }}
      WAIT_FOR_TLS: ${{ inputs.wait_for_tls }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Verify source
        run: pnpm run ci

      - name: Resolve deploy config
        id: cfg
        run: node deploy/name.mjs

      - name: Resolve Cloudflare zone/account
        id: zone
        run: node deploy/cf-api.mjs resolve-zone --domain "${{ steps.cfg.outputs.domain }}"

      - name: Export Cloudflare Account ID
        run: |
          echo "CLOUDFLARE_ACCOUNT_ID=${{ steps.zone.outputs.account_id }}" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ZONE_ID=${{ steps.zone.outputs.zone_id }}" >> "$GITHUB_ENV"

      - name: Ensure Pages project exists
        run: node deploy/cf-api.mjs ensure-pages-project --account-id "${{ steps.zone.outputs.account_id }}" --project-name "${{ steps.cfg.outputs.pages_project_name }}" --production-branch main

      - name: Prepare custom domain and DNS
        run: node deploy/cf-api.mjs ensure-pages-domain --domain "${{ steps.cfg.outputs.domain }}" --account-id "${{ steps.zone.outputs.account_id }}" --project-name "${{ steps.cfg.outputs.pages_project_name }}" --zone-id "${{ steps.zone.outputs.zone_id }}" --cname-target "${{ steps.cfg.outputs.cname_target }}"

      - name: Ensure D1 exists
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          name="${{ steps.cfg.outputs.d1_name }}"

          echo "Looking up D1 database: $name"
          db_json="$(pnpm --dir apps/worker exec wrangler d1 list --json)"
          db_id="$(node -e 'const fs=require("fs"); const name=process.argv[1]; const raw=JSON.parse(fs.readFileSync(0,"utf8")); const list=Array.isArray(raw)?raw:(Array.isArray(raw?.result)?raw.result:[]); const hit=list.find(d=>d && d.name===name); const id=hit?.uuid ?? hit?.database_id ?? hit?.id ?? hit?.databaseId; if(id) process.stdout.write(String(id));' "$name" <<<"$db_json")"

          if [ -z "${db_id}" ]; then
            echo "Creating D1 database: $name"
            if [ -n "${{ inputs.d1_location }}" ]; then
              pnpm --dir apps/worker exec wrangler d1 create "$name" --location "${{ inputs.d1_location }}"
            else
              pnpm --dir apps/worker exec wrangler d1 create "$name"
            fi

            db_json="$(pnpm --dir apps/worker exec wrangler d1 list --json)"
            db_id="$(node -e 'const fs=require("fs"); const name=process.argv[1]; const raw=JSON.parse(fs.readFileSync(0,"utf8")); const list=Array.isArray(raw)?raw:(Array.isArray(raw?.result)?raw.result:[]); const hit=list.find(d=>d && d.name===name); const id=hit?.uuid ?? hit?.database_id ?? hit?.id ?? hit?.databaseId; if(id) process.stdout.write(String(id));' "$name" <<<"$db_json")"
          fi

          if [ -z "${db_id}" ]; then
            echo "Failed to resolve D1 uuid for $name" >&2
            exit 1
          fi

          echo "INKRYPT_D1_ID=$db_id" >> "$GITHUB_ENV"
          echo "d1_id=$db_id" >> "$GITHUB_OUTPUT"

      - name: Render Worker config (wrangler.toml)
        run: |
          node deploy/render-worker-config.mjs \
            --account-id "${{ steps.zone.outputs.account_id }}" \
            --worker-name "${{ steps.cfg.outputs.worker_name }}" \
            --d1-name "${{ steps.cfg.outputs.d1_name }}" \
            --d1-id "${{ steps.d1.outputs.d1_id }}" \
            --rp-name "${{ steps.cfg.outputs.rp_name }}" \
            --rp-id "${{ steps.cfg.outputs.rp_id }}" \
            --origin "${{ steps.cfg.outputs.origin }}" \
            --cors-origin "${{ steps.cfg.outputs.origin }}" \
            --cookie-samesite "${{ steps.cfg.outputs.cookie_samesite }}" \
            --release-sha "${{ github.sha }}"

      - name: Apply D1 migrations
        run: pnpm --dir apps/worker exec wrangler d1 migrations apply "${{ steps.cfg.outputs.d1_name }}" --remote --config wrangler.toml

      - name: Validate Worker secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.INKRYPT_SESSION_SECRET }}" || { echo "INKRYPT_SESSION_SECRET is required" >&2; exit 1; }
          test -n "${{ secrets.INKRYPT_SETUP_TOKEN }}" || { echo "INKRYPT_SETUP_TOKEN is required" >&2; exit 1; }

      - name: Put Worker secrets
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.INKRYPT_SESSION_SECRET }}" | pnpm --dir apps/worker exec wrangler secret put SESSION_SECRET --name "${{ steps.cfg.outputs.worker_name }}" --config wrangler.toml
          printf '%s' "${{ secrets.INKRYPT_SETUP_TOKEN }}" | pnpm --dir apps/worker exec wrangler secret put SETUP_TOKEN --name "${{ steps.cfg.outputs.worker_name }}" --config wrangler.toml

      - name: Deploy Worker
        run: pnpm --dir apps/worker exec wrangler deploy --name "${{ steps.cfg.outputs.worker_name }}" --config wrangler.toml

      - name: Ensure Worker routes
        run: node deploy/cf-api.mjs ensure-worker-routes --zone-id "${{ steps.zone.outputs.zone_id }}" --worker-name "${{ steps.cfg.outputs.worker_name }}" --route "${{ steps.cfg.outputs.domain }}/api/*,${{ steps.cfg.outputs.domain }}/auth/*,${{ steps.cfg.outputs.domain }}/healthz*"

      - name: Verify Worker health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --retry 30 --retry-delay 5 --retry-all-errors "https://${{ steps.cfg.outputs.domain }}/healthz" >/dev/null
          curl --fail --retry 30 --retry-delay 5 --retry-all-errors "https://${{ steps.cfg.outputs.domain }}/healthz/deep" | node -e 'let raw=""; process.stdin.on("data", chunk => raw += chunk); process.stdin.on("end", () => { const body=JSON.parse(raw); if(body.status!=="ok") process.exit(1) })'

      - name: Deploy Pages
        run: pnpm --dir apps/worker exec wrangler pages deploy ../web/dist --project-name "${{ steps.cfg.outputs.pages_project_name }}" --branch main

      - name: Verify deployed site
        run: curl --fail --retry 30 --retry-delay 5 --retry-all-errors "https://${{ steps.cfg.outputs.domain }}/" >/dev/null
