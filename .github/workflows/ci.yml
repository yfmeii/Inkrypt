name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: inkrypt-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install --yes sqlite3
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci
